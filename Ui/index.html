    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <button class="closebtn" onclick="closeNav()">&times;</button>
        <a href="javascript:void(0)" class="dropdown-btn" onclick="toggleDropdown()">Clientes</a>

    <!-- Tabla Clientes -->
    <main>
        <div class="form-clientes-box">
            <h2 class="title">Clientes</h2>
            <form id="search-form-clientes">
                <input type="text" id="name-clientes" placeholder="Buscar cliente por nombre">
                <button type="submit-clientes">Buscar</button>
            </form>
            <h3>Lista de Clientes</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Accion</th>
                    </tr>
                </thead>
                <tbody id="client-table"> </tbody>
            </table>
        </div>

        <!-- Tabla Usuarios -->
        <div class="form-clientes-users">
            <h2 class="title">Usuarios</h2>
            <form id="search-form-users">
                <input type="text" id="name-users" placeholder="Buscar usuario  por nombre">
                <button type="submit-usuarios">Buscar</button>
            </form>
            <h3>Lista de Usuarios</h3>
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Accion</th>
                    </tr>
                </thead>
                <tbody id="user-table"> </tbody>
            </table>
        </div>
    </main>

    <!-- Scripts -->
