<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Clients</title>
    <link rel="stylesheet" href="css/index.css">
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
</head>

<body>


    <!-- Tabla Clientes -->
    <main>

        <div class="form-clientes-box">
            <h2 class="title">Clientes</h2>
            <form id="search-form-clientes">
                <input type="text" id="name-clientes" placeholder="Buscar cliente por nombre">
                <button type="submit-clientes">Buscar</button>
            </form>
            <h3>Lista de Clientes</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Accion</th>
                    </tr>
                </thead>
                <tbody id="client-table"> </tbody>
            </table>
        </div>


        <!-- Tabla Usuarios -->
        <div class="form-clientes-users">
            <h2 class="title">Usuarios</h2>
            <form id="search-form-users">
                <input type="text" id="name-users" placeholder="Buscar usuario  por nombre">
                <button type="submit-usuarios">Buscar</button>
            </form>
            <h3>Lista de Usuarios</h3>
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Accion</th>

                    </tr>
                </thead>
               <tbody id="user-table"> </tbody>
            </table>
        </div>



    </main>

    <script src="Js/clientes.js"></script>
    <script src="Js/users.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
