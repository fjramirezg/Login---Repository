<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Clients</title>
    <link rel="stylesheet" href="css/usuario.css">
</head>

<body>
    <main>
        <div class="form-clientes-box">
            <h2 class="title">Clientes</h2>

<form id="search-form">
    <input type="text" id="name" placeholder="Buscar cliente por nombre">
    <button type="submit">Buscar</button>
</form>

            <h3>Lista de Clientes</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Accion</th>

                    </tr>
                </thead>
                <tbody id="client-table"> </tbody>
            </table>

        </div>
    </main>
    <script src="users.js"></script>
</body>

</html>
