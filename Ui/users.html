<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Clients</title>
    <link rel="stylesheet" href="/ui/css/usuario.css">
</head>

<body>
    <main>
        <div class="form-clientes-box">
            <h2 class="title">Clientes</h2>

            <form action="process_form.php" method="POST">
                <input type="hidden" name="id" id="id" value="">

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <button type="submit">Submit</button>
            </form>

            <div>
                <input type="text" id="search-input" placeholder="Buscar por nombre">
                <button type="button" onclick="searchClient()">Buscar</button>
            </div>

            <h3>Lista de Clientes</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="client-table">
                </tbody>
            </table>
        </div>
    </main>
    <script src="/Ui/users.js"></script>
</body>

</html>
